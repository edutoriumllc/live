  const NAME = { '2d':'2D Board', '3d':'3D World' };
  const frames = {}, api = {}, waiting = { '2d':[], '3d':[] };
  let mode = null, toastT = 0;
  const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
  const decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
  // in the Android app, the app adds window.EduAndroid: it saves files to Downloads and copies text for the page
  const ANDROID = window.EduAndroid || null;

  function load(side){
    if (frames[side]) return;
    const f = document.createElement('iframe');
    f.className = 'side'; f.title = 'Edutorium Live ' + NAME[side];
    f.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
    f.setAttribute('allowfullscreen', '');
    f.hidden = side !== mode;
    f.srcdoc = decode(SRC[side]);
    document.body.appendChild(f);
    frames[side] = f;
  }
  // run fn with a side's bridge as soon as that side has started
  function whenReady(side, fn){ if (api[side]) fn(api[side]); else { waiting[side].push(fn); load(side); } }

  function showToast(msg, backTo){
    const t = document.getElementById('eduToast');
    t.querySelector('span').textContent = msg;
    const b = t.querySelector('button');
    b.hidden = !backTo; b.textContent = backTo ? '← Back to ' + (backTo === '2d' ? '2D' : '3D') : '';
    b.onclick = () => { t.hidden = true; setMode(backTo); };
    t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 7000);
  }
  function syncSwitches(){
    for (const side of ['2d', '3d']){
      const f = frames[side]; if (!f) continue;
      try { f.contentDocument.querySelectorAll('.modesw [data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode)); } catch(e){}
    }
  }
  function setMode(m, opts){
    if (m !== '2d' && m !== '3d') return;
    const changed = m !== mode;
    mode = m; lsSet('edu-mode', m);
    load(m);
    for (const side in frames) frames[side].hidden = side !== m;
    syncSwitches();
    if (changed){ try { frames[m].contentWindow.dispatchEvent(new Event('resize')); } catch(e){} }
    try { frames[m].focus(); } catch(e){}
    if (opts && opts.search !== undefined) whenReady(m, a => a.search(opts.search));
  }

  window.__EDU_SHELL = {
    get mode(){ return mode; },
    ready(side, a){
      api[side] = a;
      document.getElementById('eduLoading')?.remove();
      syncSwitches();
      const q = waiting[side].splice(0); q.forEach(fn => { try { fn(a); } catch(e){ console.warn(e); } });
      // the 3D World's Algebra heading shows the 2D Board's tiles: draw it again once both have started
      if (side === '2d' && api['3d'] && api['3d'].retray) api['3d'].retray();
      // start the other side in the background, so switching is quick
      const other = side === '2d' ? '3d' : '2d';
      if (!frames[other]) setTimeout(() => load(other), 600);
    },
    setMode,
    // a tool from the other side's menu: go there and add it
    add(side, pid, label){
      setMode(side);
      whenReady(side, a => a.add(pid));
      const from = side === '2d' ? '3d' : '2d';
      showToast(`Switched to the ${NAME[side]} for “${label}”. Your ${from === '2d' ? '2D board' : '3D world'} is kept.`, from);
    },
    // a solid's net from the 3D World: onto the 2D Board
    sendNet(net){
      setMode('2d');
      whenReady('2d', a => a.addNet(net));
      showToast('The net is on the 2D Board. To color a face, pick a color in the bar, then click the face. Your 3D world is kept.', '3d');
    },
    // the Android app: board and world links point to the website (the app's own address only works inside the app)
    publicUrl: window.__EDU_PUBLIC || null,
    saveFile: ANDROID ? (blob, name, mime) => new Promise(res => {
      const r = new FileReader();
      r.onload = () => { try { res(!!ANDROID.saveFile(String(r.result).split(',')[1] || '', name, mime || 'application/octet-stream')); } catch(e){ res(false); } };
      r.onerror = () => res(false);
      r.readAsDataURL(blob);
    }) : undefined,
    copy: ANDROID ? t => { try { return !!ANDROID.copyText(String(t)); } catch(e){ return false; } } : undefined,
    openLink: ANDROID ? url => { try { ANDROID.openUrl(String(url)); } catch(e){} } : undefined,
    find: (side, q) => { try { return api[side] ? api[side].find(q) : []; } catch(e){ return []; } },
    tiles: (side, ids) => { try { return api[side] ? api[side].tiles(ids) : []; } catch(e){ return []; } },
    // Refresh on one side refreshes the other side too (if it has started)
    refresh(from){ const other = from === '2d' ? '3d' : '2d'; if (api[other] && api[other].refresh) try { api[other].refresh(); } catch(e){ console.warn(e); } },
    // working together: what one side does (start, join, leave), the other side does with the same code
    net(from, m){ whenReady(from === '2d' ? '3d' : '2d', a => a.net(m)); }
  };

  // which side opens first: a join link opens the 2D Board (it asks for the name, and the 3D World joins with it);
  // a 3D world link opens the 3D World; otherwise the side used last on this device
  const h = location.hash, joining = new URLSearchParams(location.search).has('join');
  const first = joining || /[#&]b=/.test(h) ? '2d' : /[#&]w=/.test(h) ? '3d' : (lsGet('edu-mode') === '3d' ? '3d' : '2d');
  setMode(first);
})();
